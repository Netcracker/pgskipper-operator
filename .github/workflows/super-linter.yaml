---
# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/super-linter/super-linter
# Configuration file for super-linter example:
# .github/super-linter.env
# Configuration files for individual linters should be placed in .github/linters

name: Lint Code Base

on:
  # pull_request:
  #   branches:
  #     - '**'
  workflow_dispatch:
    inputs:
      full_scan:
        type: boolean
        default: false
        required: false
        description: "Lint all codebase"
permissions: {}

jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      # contents permission to clone the repository
      contents: read
      packages: read
      # issues and pull-requests permissions to write results as pull
      # request comments. Omit them if you don't need summary comments
      issues: write
      pull-requests: write
      # To report GitHub Actions status checks. Omit if you don't need
      # to update commit status
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: "Load super-linter environment file"
        run: |
          # shellcheck disable=2086
          if [ -f "./.github/super-linter.env" ]; then
            grep "\S" ./.github/super-linter.env | grep -v "^#"
            grep "\S" ./.github/super-linter.env | grep -v "^#" >> $GITHUB_ENV
          fi

      - name: Lint Code Base
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918  # v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: ${{ inputs.full_scan || false }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
