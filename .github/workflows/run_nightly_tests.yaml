name: Run Nightly Pgskipper Pipeline

permissions:
  actions: write
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  Nightly-Pgskipper-Pipeline:
    uses: Netcracker/qubership-test-pipelines/.github/workflows/pgskipper.yaml@abc191433a739748f08da3689db071a5e4ac79a8 # v1.17.0

    with:
      repository_name: ${{ github.repository }}
      service_branch: '${{ github.head_ref || github.ref_name }}'
      pipeline_branch: 'abc191433a739748f08da3689db071a5e4ac79a8' # v1.17.0 renovate: depName=Netcracker/qubership-test-pipelines
      runner_type: 'ubuntu-latest'
      scope: 'nightly'
    secrets:
      AWS_S3_ACCESS_KEY_ID: ${{secrets.AWS_S3_ACCESS_KEY_ID}}
      AWS_S3_ACCESS_KEY_SECRET: ${{secrets.AWS_S3_ACCESS_KEY_SECRET}}
