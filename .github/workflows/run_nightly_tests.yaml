name: Run Nightly Pgskipper Pipeline

permissions:
  actions: write
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  Nightly-Pgskipper-Pipeline:
    uses: Netcracker/qubership-test-pipelines/.github/workflows/pgskipper.yaml@747df4a75b81fd05ed818a8cde6fc8198b2989c0 # v1.19.0

    with:
      repository_name: ${{ github.repository }}
      service_branch: '${{ github.head_ref || github.ref_name }}'
      pipeline_branch: '747df4a75b81fd05ed818a8cde6fc8198b2989c0' # v1.19.0 renovate: depName=Netcracker/qubership-test-pipelines
      runner_type: 'ubuntu-latest'
      scope: 'nightly'
    secrets:
      AWS_S3_ACCESS_KEY_ID: ${{secrets.AWS_S3_ACCESS_KEY_ID}}
      AWS_S3_ACCESS_KEY_SECRET: ${{secrets.AWS_S3_ACCESS_KEY_SECRET}}
